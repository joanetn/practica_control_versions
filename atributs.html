<!DOCTYPE html>
<html>

<body>

    <h2>Modificar atributos con JavaScript</h2>

    <img id="myImage" src="https://via.placeholder.com/150" alt="Imagen de prueba">

    <br><br>

    <button type="button" onclick='document.getElementById("myImage").src = "https://via.placeholder.com/300"'>
        Cambiar imagen
    </button>

    <button type="button" onclick='document.getElementById("myImage").alt = "Imagen modificada con JS"'>
        Cambiar atributo alt
    </button>

</body>

</html>
